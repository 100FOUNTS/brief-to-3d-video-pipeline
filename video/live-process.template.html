<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Blender en vivo · proceso</title>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0f1115; }
  #scene { position: relative; width: 1920px; height: 1080px; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; color: #f4f1ea; }
  .step-img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; opacity: 0; }
  .band { position: absolute; left: 0; right: 0; bottom: 0; height: 250px; background: linear-gradient(to top, rgba(15,17,21,0.96) 55%, rgba(15,17,21,0)); }
  .cap { position: absolute; left: 90px; right: 90px; bottom: 56px; opacity: 0; }
  .tag { font: 500 28px/1 ui-monospace, Menlo, monospace; letter-spacing: 0.18em; text-transform: uppercase; color: #ffc532; }
  .change { margin-top: 18px; font-weight: 800; font-size: 64px; letter-spacing: -0.01em; line-height: 1.05; }
  .change small { font: 500 40px/1 ui-monospace, Menlo, monospace; color: #ffc532; margin-left: 18px; letter-spacing: 0; }
  .obs { margin-top: 14px; font-size: 38px; line-height: 1.25; color: rgba(244,241,234,0.85); }
  .mark { position: absolute; left: 90px; top: 60px; font: 500 24px/1 ui-monospace, Menlo, monospace; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(244,241,234,0.8); opacity: 0; text-shadow: 0 2px 12px rgba(0,0,0,0.7); }
  .bar { position: absolute; left: 90px; top: 110px; display: flex; gap: 10px; opacity: 0; }
  .bar i { display: block; width: 70px; height: 6px; border-radius: 3px; background: rgba(244,241,234,0.25); }
  .card { position: absolute; inset: 0; background: #0f1115; display: flex; flex-direction: column; justify-content: center; padding: 0 160px; opacity: 0; }
  .card h1 { margin: 0; font-size: 110px; line-height: 1.02; font-weight: 800; letter-spacing: -0.02em; max-width: 1500px; }
  .card p { margin: 36px 0 0; font-size: 44px; line-height: 1.3; color: rgba(244,241,234,0.82); max-width: 1450px; }
  .card .tag { margin-bottom: 30px; }
</style>
</head>
<body>
<div id="scene"></div>
<script>
  // Live-process video: each step is a real image rendered by Blender during the session; the captions come from the session report.
  // (The on-screen text is Spanish: it is the content of the recorded session.)
  const DATA = /*DATA*/;
  const TITLE = 2.6, PER_STEP = 4.0, CLOSING = 4.0, FADE = 0.5;
  window.DURATION = TITLE + DATA.steps.length * PER_STEP + CLOSING;

  const clamp01 = (x) => Math.min(1, Math.max(0, x));
  const smooth = (x) => x * x * (3 - 2 * x);
  const span = (t, a, b) => smooth(clamp01((t - a) / (b - a)));
  const windowed = (t, a, b, f) => Math.min(span(t, a - f, a), 1 - span(t, b, b + f));
  const el = (html, cls, parent) => { const d = document.createElement('div'); if (cls) d.className = cls; d.innerHTML = html; parent.appendChild(d); return d; };
  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

  const root = document.getElementById('scene');
  const imgs = DATA.steps.map((p) => { const i = document.createElement('img'); i.className = 'step-img'; i.src = p.image; root.appendChild(i); return i; });
  el('', 'band', root);
  const mark = el('Blender en vivo · MCP', 'mark', root);
  const bar = el(DATA.steps.map(() => '<i></i>').join(''), 'bar', root);
  const caps = DATA.steps.map((p, k) => {
    const change = p.n === 0 ? 'Estado inicial' : `${esc(p.object)}<small>${esc(p.value)}</small>`;
    return el(`<div class="tag">Paso ${p.n} de ${DATA.steps.length - 1}</div><div class="change">${change}</div><div class="obs">${esc(p.obs)}</div>`, 'cap', root);
  });
  const cardStart = el(`<div class="tag">Fase 4b · segunda forma</div><h1>${esc(DATA.title)}</h1><p>${esc(DATA.subtitle)}</p>`, 'card', root);
  const cardEnd = el(`<div class="tag">Conclusión de la sesión</div><h1>${esc(DATA.closing_title)}</h1><p>${esc(DATA.closing_text)}</p>`, 'card', root);

  window.seek = function (t) {
    const start = TITLE, end = TITLE + DATA.steps.length * PER_STEP;
    cardStart.style.opacity = (1 - span(t, TITLE - FADE, TITLE)).toFixed(3);
    cardEnd.style.opacity = span(t, end, end + FADE).toFixed(3);
    const inSteps = span(t, start - FADE, start) * (1 - span(t, end, end + FADE));
    DATA.steps.forEach((p, k) => {
      const a = start + k * PER_STEP, b = a + PER_STEP;
      // each step's image stays until the next one comes in (cross-fade)
      const entering = k === 0 ? 1 : span(t, a - FADE / 2, a + FADE / 2);
      imgs[k].style.opacity = (inSteps * (k === DATA.steps.length - 1 || t < b - FADE / 2 ? entering : 1)).toFixed(3);
      const v = windowed(t, a + 0.15, b - 0.1, 0.3);
      caps[k].style.opacity = v.toFixed(3);
      caps[k].style.transform = `translateY(${((1 - v) * 24).toFixed(1)}px)`;
    });
    mark.style.opacity = inSteps.toFixed(3);
    bar.style.opacity = inSteps.toFixed(3);
    bar.querySelectorAll('i').forEach((i, k) => { i.style.background = (t >= start + k * PER_STEP) ? '#ffb703' : 'rgba(244,241,234,0.25)'; });
  };
  window.seek(0);
</script>
</body>
</html>
