<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Lámpara Arco · title</title>
<style>
  :root { --bg: #0f1115; --accent: #ffb703; --text: #f4f1ea; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  #scene { position: relative; width: 1920px; height: 1080px; }
  #title {
    position: absolute; left: 0; width: 1920px; top: 440px; text-align: center;
    font: 600 168px/1 -apple-system, "Helvetica Neue", Arial, sans-serif;
    letter-spacing: 6px; color: var(--text); opacity: 0;
  }
  #line {
    position: absolute; left: 640px; top: 660px; height: 6px; width: 0;
    background: var(--accent); border-radius: 3px;
  }
</style>
</head>
<body>
<div id="scene">
  <div id="title">Lámpara Arco</div>
  <div id="line"></div>
</div>
<script>
  // Everything depends only on t (seconds). No Date, requestAnimationFrame, setTimeout or CSS animations.
  window.DURATION = 8;

  const clamp01 = (x) => Math.min(1, Math.max(0, x));
  const smooth = (x) => x * x * (3 - 2 * x);                  // smoothstep
  const span = (t, ini, fin) => smooth(clamp01((t - ini) / (fin - ini)));

  const title = document.getElementById('title');
  const line = document.getElementById('line');
  const LINE_WIDTH = 640;

  window.seek = function (t) {
    title.style.opacity = span(t, 0.5, 1.5).toFixed(4);     // fade between 0.5 s and 1.5 s
    line.style.width = (LINE_WIDTH * span(t, 1, 3)).toFixed(2) + 'px'; // drawn between 1 s and 3 s
  };

  window.seek(0);
</script>
</body>
</html>
