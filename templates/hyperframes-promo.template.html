<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>{{NAME}} · promo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Palette (brief.md): background {{BACKGROUND}} · text {{TEXT}} · accent {{ACCENT}} · brass {{BRASS}} */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: {{BACKGROUND}}; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: {{BACKGROUND}}; color: {{TEXT}}; }

      /* Background layer */
      #halo { position: absolute; inset: 0; background: radial-gradient(ellipse 60% 70% at 50% 58%, {{BACKGROUND2}} 0%, {{BACKGROUND}} 70%); }

      /* Arc (the curve) + light: a single group so they rotate together */
      #arc-group { position: absolute; inset: 0; }
      #arc { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      #light { position: absolute; left: 0; top: 0; width: 0; height: 0; }
      .glow { position: absolute; left: 0; top: 0; width: 1500px; height: 1500px; border-radius: 50%; }
      #glow-cool { background: radial-gradient(circle, rgba({{NEUTRAL_LIGHT_RGB}},0.30) 0%, rgba({{NEUTRAL_LIGHT_RGB}},0.10) 30%, rgba({{NEUTRAL_LIGHT_RGB}},0) 62%); }
      #glow-warm { background: radial-gradient(circle, rgba({{ACCENT_RGB}},0.42) 0%, rgba({{ACCENT_RGB}},0.13) 30%, rgba({{ACCENT_RGB}},0) 62%); opacity: 0; }
      #bulb { position: absolute; left: 0; top: 0; width: 30px; height: 30px; border-radius: 50%; background: {{NEUTRAL_LIGHT}}; box-shadow: 0 0 40px 14px rgba({{BULB_HALO_RGB}},0.7); }

      /* Text scenes */
      .scene { position: absolute; inset: 0; }
      .inner {
        position: absolute; inset: 0; padding-top: 290px;
        display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
      }
      .word { font-family: Montserrat, sans-serif; font-weight: 900; text-transform: uppercase; letter-spacing: -0.03em; line-height: 1; color: {{TEXT}}; }
      .title { font-size: 280px; }
      .benefit { font-size: 190px; }
      .mono { font-family: "IBM Plex Mono", monospace; font-weight: 400; }
      .label { font-size: 34px; letter-spacing: 0.18em; color: {{ACCENT_LABEL}}; margin-bottom: 26px; }
      .detail { font-size: 40px; letter-spacing: 0.04em; color: {{TEXT}}; opacity: 0.8; margin-top: 34px; }
      .subtitle { font-size: 34px; letter-spacing: 0.22em; text-transform: uppercase; color: {{TEXT}}; margin-top: 40px; }
      .ghost { position: absolute; right: 90px; bottom: 60px; font-family: "IBM Plex Mono", monospace; font-weight: 700; font-size: 520px; line-height: 1; color: {{TEXT}}; opacity: 0.035; }
      #closing-line { width: 560px; height: 6px; margin-top: 36px; background: {{ACCENT}}; border-radius: 3px; transform-origin: 0% 50%; }

      #fade-in, #fade-out { position: absolute; inset: 0; background: {{BACKGROUND}}; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1920" data-height="1080">
      <div id="halo"></div>

      <div id="arc-group">
        <svg id="arc" viewBox="0 0 1920 1080" fill="none">
          <path id="arc-stroke" d="M 160 860 Q 960 60 1760 860" stroke="{{TEXT}}" stroke-width="4" stroke-linecap="round" opacity="0.85" />
          <circle id="joint1" cx="560" cy="560" r="22" stroke="{{BRASS}}" stroke-width="5" opacity="0" />
          <circle id="joint2" cx="1360" cy="560" r="22" stroke="{{BRASS}}" stroke-width="5" opacity="0" />
        </svg>
        <div id="light">
          <div id="glow-cool" class="glow"></div>
          <div id="glow-warm" class="glow"></div>
          <div id="bulb"></div>
        </div>
      </div>

      <section id="s1" class="scene clip" data-start="0" data-duration="5" data-track-index="1">
        <div class="inner">
          <div id="s1-title" class="word title">{{NAME}}</div>
          <div id="s1-sub" class="mono subtitle">{{TAGLINE}}</div>
        </div>
      </section>

      <section id="s2" class="scene clip" data-start="5" data-duration="4" data-track-index="1">
        <div class="ghost" id="s2-ghost">01</div>
        <div class="inner" id="s2-inner">
          <div id="s2-label" class="mono label">01 / 03</div>
          <div id="s2-word" class="word benefit">{{B1_WORD}}</div>
          <div id="s2-detail" class="mono detail">{{B1_DETAIL}}</div>
        </div>
      </section>

      <section id="s3" class="scene clip" data-start="9" data-duration="4" data-track-index="1">
        <div class="ghost" id="s3-ghost">02</div>
        <div class="inner" id="s3-inner">
          <div id="s3-label" class="mono label">02 / 03</div>
          <div id="s3-word" class="word benefit">{{B2_WORD}}</div>
          <div id="s3-detail" class="mono detail">{{B2_DETAIL}}</div>
        </div>
      </section>

      <section id="s4" class="scene clip" data-start="13" data-duration="4" data-track-index="1">
        <div class="ghost" id="s4-ghost">03</div>
        <div class="inner" id="s4-inner">
          <div id="s4-label" class="mono label">03 / 03</div>
          <div id="s4-word" class="word benefit">{{B3_WORD}}</div>
          <div id="s4-detail" class="mono detail">{{B3_DETAIL}}</div>
        </div>
      </section>

      <section id="s5" class="scene clip" data-start="17" data-duration="3" data-track-index="1">
        <div class="inner" id="s5-inner">
          <div id="s5-title" class="word title">{{NAME}}</div>
          <div id="closing-line"></div>
          <div id="s5-sub" class="mono subtitle">{{TAGLINE}}</div>
        </div>
      </section>

      <div id="fade-in"></div>
      <div id="fade-out"></div>
    </div>

    <script>
      // Point on the arc for u in [0,1] (same curve as the stroke: Q with control point at (960,60)).
      const A = (u) => ({ x: 160 + 1600 * u, y: 860 - 1600 * u * (1 - u) });
      // Movement of the light along the arc: a polyline of keyframes with smooth easing,
      // so it follows the curve and not the straight chord.
      const rise = (k) => k * k * (3 - 2 * k);
      function travel(u0, u1, dur, n = 16) {
        return Array.from({ length: n }, (_, i) => {
          const p = A(u0 + (u1 - u0) * rise((i + 1) / n));
          return { x: p.x, y: p.y, duration: dur / n, ease: "none" };
        });
      }

      const tl = gsap.timeline({ paused: true });

      // Initial state of the light: at the top of the arc, switched off
      const apex = A(0.5);
      gsap.set("#light", { x: apex.x, y: apex.y });
      gsap.set(".glow", { xPercent: -50, yPercent: -50 });
      gsap.set("#bulb", { xPercent: -50, yPercent: -50 });
      gsap.set("#light", { opacity: 0, scale: 0.6 });
      const length = document.getElementById("arc-stroke").getTotalLength();
      gsap.set("#arc-stroke", { strokeDasharray: length, strokeDashoffset: length });
      gsap.set("#arc-group", { transformOrigin: "960px 860px" });

      // Fade in from black
      tl.fromTo("#fade-in", { opacity: 1 }, { opacity: 0, duration: 0.6, ease: "power1.out" }, 0);

      // Scene 1 (0-5 s): the arc is drawn, the light turns on, the title appears
      tl.to("#arc-stroke", { strokeDashoffset: 0, duration: 2.1, ease: "power2.inOut" }, 0.3);
      tl.to("#light", { opacity: 1, scale: 1, duration: 1.0, ease: "power2.out" }, 2.1);
      // The arc steps back so it does not cross the text at full contrast
      tl.to("#arc-stroke", { opacity: 0.32, duration: 0.8, ease: "power2.inOut" }, 2.6);
      tl.fromTo("#s1-title", { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.9, ease: "power3.out" }, 2.3);
      tl.fromTo("#s1-sub", { y: 24, opacity: 0 }, { y: 0, opacity: 0.85, duration: 0.7, ease: "power2.out" }, 3.1);
      tl.to("#s1-title, #s1-sub", { opacity: 0, y: -30, duration: 0.5, ease: "power2.in" }, 4.4);

      // Scene 2 (5-9 s): benefit 1 — the light moves down to the left side
      tl.to("#light", { keyframes: travel(0.5, 0.2, 1.1) }, 5.0);
      tl.fromTo("#s2-ghost", { opacity: 0, y: 40 }, { opacity: 0.035, y: 0, duration: 1.2, ease: "power2.out" }, 5.0);
      tl.fromTo("#s2-label", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 5.3);
      tl.fromTo("#s2-word", { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, 5.4);
      tl.fromTo("#s2-detail", { y: 24, opacity: 0 }, { y: 0, opacity: 0.8, duration: 0.6, ease: "power2.out" }, 5.9);
      tl.to("#s2-inner, #s2-ghost", { opacity: 0, duration: 0.45, ease: "power2.in" }, 8.5);

      // Scene 3 (9-13 s): benefit 2 — the light crosses to the right side and the arc sways
      tl.to("#light", { keyframes: travel(0.2, 0.8, 1.5) }, 9.0);
      tl.fromTo("#joint1, #joint2", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 9.6);
      tl.to("#arc-group", { rotation: -3, duration: 0.9, ease: "sine.inOut" }, 10.3);
      tl.to("#arc-group", { rotation: 3, duration: 1.2, ease: "sine.inOut" }, 11.2);
      tl.to("#arc-group", { rotation: 0, duration: 0.8, ease: "sine.inOut" }, 12.4);
      tl.fromTo("#s3-ghost", { opacity: 0, y: 40 }, { opacity: 0.035, y: 0, duration: 1.2, ease: "power2.out" }, 9.0);
      tl.fromTo("#s3-label", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 9.3);
      tl.fromTo("#s3-word", { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, 9.4);
      tl.fromTo("#s3-detail", { y: 24, opacity: 0 }, { y: 0, opacity: 0.8, duration: 0.6, ease: "power2.out" }, 9.9);
      tl.to("#s3-inner, #s3-ghost", { opacity: 0, duration: 0.45, ease: "power2.in" }, 12.5);

      // Scene 4 (13-17 s): benefit 3 — the light returns to the top and turns golden
      tl.to("#light", { keyframes: travel(0.8, 0.5, 1.1) }, 13.0);
      tl.to("#joint1, #joint2", { opacity: 0, duration: 0.4, ease: "power2.in" }, 13.0);
      tl.to("#glow-cool", { opacity: 0, duration: 1.2, ease: "sine.inOut" }, 13.3);
      tl.to("#glow-warm", { opacity: 1, duration: 1.2, ease: "sine.inOut" }, 13.3);
      tl.to("#bulb", { backgroundColor: "{{ACCENT}}", boxShadow: "0 0 56px 22px rgba({{ACCENT_RGB}},0.75)", duration: 1.2, ease: "sine.inOut" }, 13.3);
      tl.to("#light", { scale: 1.25, duration: 1.4, ease: "sine.inOut" }, 13.3);
      tl.fromTo("#s4-ghost", { opacity: 0, y: 40 }, { opacity: 0.035, y: 0, duration: 1.2, ease: "power2.out" }, 13.0);
      tl.fromTo("#s4-label", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 13.3);
      tl.fromTo("#s4-word", { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, 13.4);
      tl.fromTo("#s4-detail", { y: 24, opacity: 0 }, { y: 0, opacity: 0.8, duration: 0.6, ease: "power2.out" }, 13.9);
      tl.to("#s4-inner, #s4-ghost", { opacity: 0, duration: 0.45, ease: "power2.in" }, 16.5);

      // Scene 5 (17-20 s): closing and fade to black
      tl.fromTo("#s5-title", { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.9, ease: "power3.out" }, 17.2);
      tl.fromTo("#closing-line", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power2.inOut" }, 17.9);
      tl.fromTo("#s5-sub", { y: 24, opacity: 0 }, { y: 0, opacity: 0.85, duration: 0.7, ease: "power2.out" }, 18.3);
      tl.fromTo("#fade-out", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power1.in" }, 19.3);

      // Glow breathing (ambient, finite): repeats a whole number of times within the 20 s
      tl.to("#glow-cool, #glow-warm", { scale: 1.06, duration: 2, ease: "sine.inOut", yoyo: true, repeat: 8 }, 2.1);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
