<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Lámpara Arco</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #0f1115;
  }
  #stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: #0f1115;
  }
  #titulo {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #f4f1ea;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 300;
    font-size: 150px;
    line-height: 1;
    letter-spacing: 6px;
    white-space: nowrap;
    opacity: 0;
  }
  #linea {
    position: absolute;
    left: 560px;
    top: 650px;
    width: 800px;
    height: 8px;
    background: #ffb703;
    transform-origin: left center;
    transform: scaleX(0);
  }
</style>
</head>
<body>
<div id="stage">
  <div id="titulo">Lámpara Arco</div>
  <div id="linea"></div>
</div>
<script>
  window.DURATION = 8;

  function clamp01(x) { return Math.min(1, Math.max(0, x)); }

  // Progreso lineal de t entre a y b, con suavizado.
  function progreso(t, a, b) {
    var p = clamp01((t - a) / (b - a));
    return p * p * (3 - 2 * p);
  }

  var titulo = document.getElementById("titulo");
  var linea = document.getElementById("linea");

  window.seek = function (t) {
    titulo.style.opacity = String(progreso(t, 0.5, 1.5));
    linea.style.transform = "scaleX(" + progreso(t, 1, 3) + ")";
  };

  window.seek(0);
</script>
</body>
</html>
