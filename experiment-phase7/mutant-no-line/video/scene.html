<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Lámpara Arco · título</title>
<style>
  :root { --fondo: #0f1115; --acento: #ffb703; --texto: #f4f1ea; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--fondo); }
  #escena { position: relative; width: 1920px; height: 1080px; }
  #titulo {
    position: absolute; left: 0; width: 1920px; top: 440px; text-align: center;
    font: 600 168px/1 -apple-system, "Helvetica Neue", Arial, sans-serif;
    letter-spacing: 6px; color: var(--texto); opacity: 0;
  }
  #linea {
    position: absolute; left: 640px; top: 660px; height: 6px; width: 0;
    background: var(--acento); border-radius: 3px;
  }
</style>
</head>
<body>
<div id="escena">
  <div id="titulo">Lámpara Arco</div>
  <div id="linea"></div>
</div>
<script>
  // Todo depende solo de t (segundos). Sin Date, requestAnimationFrame, setTimeout ni animaciones CSS.
  window.DURATION = 8;

  const clamp01 = (x) => Math.min(1, Math.max(0, x));
  const suave = (x) => x * x * (3 - 2 * x);                  // smoothstep
  const tramo = (t, ini, fin) => suave(clamp01((t - ini) / (fin - ini)));

  const titulo = document.getElementById('titulo');
  const linea = document.getElementById('linea');
  const ANCHO_LINEA = 640;

  window.seek = function (t) {
    titulo.style.opacity = tramo(t, 0.5, 1.5).toFixed(4);     // fundido entre 0,5 s y 1,5 s
    linea.style.width = (0).toFixed(2) + 'px'; // se dibuja entre 1 s y 3 s
  };

  window.seek(0);
</script>
</body>
</html>
