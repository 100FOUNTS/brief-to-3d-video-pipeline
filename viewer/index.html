<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arco · visor 3D</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cpath d=%27M4 26 Q16 -6 28 26%27 fill=%27none%27 stroke=%27%23ffb703%27 stroke-width=%273%27 stroke-linecap=%27round%27/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/estilos.css" />
  </head>
  <body>
    <canvas id="escena" aria-label="Lámpara Arco en 3D. Arrastra para girar, rueda para acercar."></canvas>

    <header class="cabecera">
      <h1>Arco</h1>
      <p>Lámpara de escritorio articulada</p>
    </header>

    <aside class="panel" aria-live="polite">
      <p class="etiqueta">Piezas</p>
      <ul id="lista-piezas" class="piezas"></ul>
      <div id="info" class="info">
        <p class="etiqueta">Selecciona una pieza</p>
        <p class="info-detalle">Pulsa sobre la lámpara o elige una de la lista.</p>
      </div>
    </aside>

    <section class="controles" aria-label="Controles">
      <label class="control">
        <span class="etiqueta">Vista explosionada</span>
        <input id="explosion" type="range" min="0" max="1" step="0.01" value="0" />
      </label>
      <div class="control">
        <span class="etiqueta">Color de la pantalla</span>
        <div id="colores" class="colores" role="radiogroup" aria-label="Color de la pantalla"></div>
      </div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
