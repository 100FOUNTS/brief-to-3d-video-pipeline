<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>WebGL2 · degradado</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f1115; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
  #errores { position: fixed; left: 12px; bottom: 12px; right: 12px; margin: 0; padding: 12px; background: #3a1216; color: #ffd6d6; font: 13px/1.4 ui-monospace, Menlo, monospace; white-space: pre-wrap; display: none; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<pre id="errores"></pre>
<script>
  // Fase 3b, parte A: el pipeline mínimo de WebGL2, sin librerías.
  // Un triángulo que cubre toda la pantalla + un fragment shader que pinta cada píxel en función de u_time.
  window.DURATION = 10;

  const VERTEX = `#version 300 es
  // Triángulo gigante generado solo con gl_VertexID (0, 1, 2): no hace falta ningún buffer.
  void main() {
    vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));   // (0,0) (2,0) (0,2)
    gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);                            // (-1,-1) (3,-1) (-1,3)
  }`;

  const FRAGMENT = `#version 300 es
  precision highp float;
  uniform float u_time;
  uniform vec2 u_resolution;
  out vec4 outColor;

  void main() {
    vec2 uv = gl_FragCoord.xy / u_resolution;                 // 0..1, origen abajo a la izquierda
    vec3 abajo = vec3(0.110, 0.145, 0.255);                   // #1c2541
    vec3 arriba = vec3(0.043, 0.075, 0.169);                  // #0b132b
    vec3 color = mix(abajo, arriba, uv.y);                    // degradado vertical
    float pulso = 0.5 + 0.5 * sin(u_time * 0.9);              // 0..1 que va y viene con el tiempo
    color += vec3(0.30, 0.16, 0.0) * pulso * pow(1.0 - uv.y, 2.0);   // luz cálida que sube desde abajo
    outColor = vec4(color, 1.0);
  }`;

  const canvas = document.getElementById('c');
  const panelErrores = document.getElementById('errores');
  const gl = canvas.getContext('webgl2', { preserveDrawingBuffer: true });   // preserveDrawingBuffer: las capturas no salen negras
  const fallo = (msg) => { console.error(msg); panelErrores.textContent += msg + '\n'; panelErrores.style.display = 'block'; };
  if (!gl) { fallo('Este navegador no tiene WebGL2.'); throw new Error('sin WebGL2'); }

  // Compilar un shader y mostrar su registro de errores si falla (getShaderInfoLog).
  function compilar(tipo, fuente) {
    const s = gl.createShader(tipo);
    gl.shaderSource(s, fuente);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      const nombre = tipo === gl.VERTEX_SHADER ? 'vertex' : 'fragment';
      throw new Error(`Error en el shader ${nombre}:\n${gl.getShaderInfoLog(s)}`);
    }
    return s;
  }
  window.__compilar = (tipo, fuente) => compilar(tipo === 'vertex' ? gl.VERTEX_SHADER : gl.FRAGMENT_SHADER, fuente);

  let programa;
  try {
    programa = gl.createProgram();
    gl.attachShader(programa, compilar(gl.VERTEX_SHADER, VERTEX));
    gl.attachShader(programa, compilar(gl.FRAGMENT_SHADER, FRAGMENT));
    gl.linkProgram(programa);
    if (!gl.getProgramParameter(programa, gl.LINK_STATUS)) throw new Error('Error al enlazar el programa:\n' + gl.getProgramInfoLog(programa));
  } catch (e) { fallo(e.message); throw e; }

  gl.useProgram(programa);
  gl.bindVertexArray(gl.createVertexArray());                 // WebGL2 exige un VAO, aunque esté vacío
  const uTime = gl.getUniformLocation(programa, 'u_time');
  const uRes = gl.getUniformLocation(programa, 'u_resolution');
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.uniform2f(uRes, canvas.width, canvas.height);

  // El fotograma del segundo t depende solo de t (igual que en la Fase 1).
  window.seek = (t) => {
    gl.uniform1f(uTime, t);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  };
  window.seek(0);

  // En el navegador (sin #render) se anima solo; el renderizador carga la página con #render y llama a seek(t) él mismo.
  if (location.hash !== '#render') {
    const t0 = performance.now();
    (function bucle(ahora) { window.seek(((ahora - t0) / 1000) % window.DURATION); requestAnimationFrame(bucle); })(t0);
  }
</script>
</body>
</html>
