<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>WebGL2 · agua</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f1115; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
  #errores { position: fixed; left: 12px; bottom: 12px; right: 12px; margin: 0; padding: 12px; background: #3a1216; color: #ffd6d6; font: 13px/1.4 ui-monospace, Menlo, monospace; white-space: pre-wrap; display: none; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<pre id="errores"></pre>
<script>
  // Fase 3b, parte B: agua con reflejo del cielo, efecto Fresnel y un ciclo día-noche de 20 s. WebGL2 puro, sin librerías.
  // Ciclo: t=0 amanecer · t=5 mediodía · t=10 atardecer · t=15 noche · t=20 vuelve al amanecer.
  window.DURATION = 20;

  const VERTEX = `#version 300 es
  void main() {
    vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
    gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
  }`;

  const FRAGMENT = `#version 300 es
  precision highp float;
  uniform float u_time;
  uniform vec2 u_resolution;
  out vec4 outColor;

  const float CICLO = 20.0;
  const float PI2 = 6.2831853;

  // ---- ruido determinista (sin texturas) ----
  float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
  float noise(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
  }
  float fbm(vec2 p) {
    float a = 0.5, s = 0.0;
    for (int i = 0; i < 4; i++) { s += a * noise(p); p = p * 2.03 + vec2(11.7, 3.1); a *= 0.5; }
    return s;
  }

  // ---- altura de las olas: tres senos en distintas direcciones + ruido fino ----
  float altura(vec2 p, float t) {
    p += 0.45 * vec2(fbm(p * 0.35 + vec2(0.0, t * 0.05)), fbm(p * 0.35 + vec2(7.3, -t * 0.04))) - 0.22;   // rompe las bandas regulares
    float h = 0.0;
    h += 0.10  * sin(dot(p, vec2( 0.70,  0.40)) * 1.6 + t * 1.1);
    h += 0.06  * sin(dot(p, vec2(-0.30,  0.90)) * 2.7 + t * 1.5);
    h += 0.035 * sin(dot(p, vec2( 0.95, -0.20)) * 4.3 - t * 1.9);
    h += 0.020 * sin(dot(p, vec2(-0.80, -0.55)) * 7.1 + t * 2.4);
    h += 0.05  * (fbm(p * 1.7 + vec2(t * 0.15, -t * 0.10)) - 0.5);
    return h;
  }
  // La normal sale de la pendiente de la altura (diferencias finitas).
  vec3 normalOla(vec2 p, float t, float suavizado) {
    float e = 0.02;
    float h0 = altura(p, t);
    float dx = altura(p + vec2(e, 0.0), t) - h0;
    float dz = altura(p + vec2(0.0, e), t) - h0;
    vec3 n = normalize(vec3(-dx / e, 1.0, -dz / e));
    return normalize(mix(n, vec3(0.0, 1.0, 0.0), suavizado));   // a lo lejos las olas se aplanan (evita el parpadeo)
  }

  // ---- cielo ----
  vec3 colorSol(float alturaSol) { return mix(vec3(1.0, 0.62, 0.20), vec3(1.0, 0.95, 0.85), smoothstep(0.0, 0.5, alturaSol)); }

  // disco: 1 = dibuja el disco del sol (vista directa), 0 = no (en el reflejo del agua el sol se ve como destellos, no como disco)
  vec3 cielo(vec3 d, vec3 sol, float dia, float disco) {
    float h = clamp(d.y, 0.0, 1.0);
    float k = pow(1.0 - h, 3.0);                                       // 1 en el horizonte, 0 arriba
    vec3 nocheArriba = vec3(0.043, 0.075, 0.169);                      // #0b132b
    vec3 nocheHoriz  = vec3(0.110, 0.145, 0.255);                      // #1c2541
    vec3 diaArriba   = vec3(0.14, 0.38, 0.74);
    vec3 diaHoriz    = vec3(0.62, 0.78, 0.92);
    vec3 arriba = mix(nocheArriba, diaArriba, dia);
    vec3 horiz  = mix(nocheHoriz, diaHoriz, dia);
    vec3 c = mix(arriba, horiz, k);

    float alSol = max(dot(d, sol), 0.0);
    float crepusculo = (1.0 - abs(clamp(sol.y * 3.0, -1.0, 1.0)));      // máximo cuando el sol está en el horizonte
    c += vec3(1.0, 0.72, 0.20) * pow(alSol, 4.0) * crepusculo * 0.55 * k; // resplandor dorado en el horizonte
    vec3 cs = colorSol(sol.y);
    float visible = smoothstep(-0.12, 0.02, sol.y);
    c += cs * (pow(alSol, 96.0) * 0.8 + pow(alSol, 8.0) * 0.18) * visible; // halo
    c += cs * smoothstep(0.99955, 0.99985, alSol) * 6.0 * visible * disco;  // disco del sol

    if (d.y > 0.0) {
      // nubes: ruido que se desplaza despacio; de día son blancas, al atardecer toman el color del sol, de noche casi desaparecen
      vec2 cp = d.xz / (d.y + 0.18) * 1.3 + vec2(u_time * 0.025, 0.0);
      float nube = smoothstep(0.50, 0.82, fbm(cp)) * smoothstep(0.0, 0.18, d.y);
      vec3 colorNube = mix(vec3(0.10, 0.12, 0.20), vec3(0.98, 0.97, 0.95), dia) + cs * crepusculo * 0.35;
      c = mix(c, colorNube, nube * 0.75);
      // estrellas: solo con el sol bien por debajo del horizonte
      vec2 sp = d.xz / (d.y + 0.35) * 70.0;
      float estrella = step(0.9965, hash(floor(sp)));
      c += vec3(0.9, 0.95, 1.0) * estrella * (1.0 - smoothstep(-0.20, 0.0, sol.y)) * (1.0 - nube) * smoothstep(0.02, 0.25, d.y) * 0.9;
    }
    return c;
  }

  void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution) / u_resolution.y;
    float t = u_time;

    // Sol: sube y baja una vez cada CICLO segundos.
    float elev = 0.80 * sin(PI2 * t / CICLO);
    vec3 sol = normalize(vec3(0.38 * cos(PI2 * t / CICLO), sin(elev), cos(elev) * 0.96));   // sale por la derecha y se pone por la izquierda
    float dia = smoothstep(-0.12, 0.38, sol.y);

    // Cámara fija mirando al horizonte, con una leve deriva.
    vec3 ro = vec3(0.0, 1.5, t * 0.25);
    vec3 rd = normalize(vec3(uv.x, uv.y - 0.10, 1.45));

    vec3 color;
    if (rd.y >= -0.002) {
      color = cielo(rd, sol, dia, 1.0);
    } else {
      float dist = -ro.y / rd.y;
      vec3 p = ro + rd * dist;
      vec3 n = normalOla(p.xz, t, 1.0 - exp(-dist * 0.035));

      vec3 refl = reflect(rd, n);
      refl.y = abs(refl.y);                                            // no reflejar "hacia abajo"
      vec3 reflejoCielo = cielo(refl, sol, dia, 0.0);

      float cosV = max(dot(n, -rd), 0.0);
      float fresnel = 0.02 + 0.98 * pow(1.0 - cosV, 5.0);              // Fresnel (aproximación de Schlick)

      vec3 profundo = mix(vec3(0.012, 0.035, 0.065), vec3(0.02, 0.15, 0.24), dia);
      vec3 agua = profundo + colorSol(sol.y) * dia * 0.05 * max(n.y, 0.0);

      color = mix(agua, reflejoCielo, fresnel);

      // destello especular del sol sobre las olas
      float brillo = pow(max(dot(reflect(rd, n), sol), 0.0), 520.0);
      color += colorSol(sol.y) * min(brillo, 1.0) * 1.8 * smoothstep(-0.04, 0.06, sol.y);   // destellos: acotados para que no parezcan espuma

      // a lo lejos el agua se funde con el horizonte
      vec3 horizonte = cielo(normalize(vec3(rd.x, 0.0, rd.z)), sol, dia, 0.0);
      color = mix(color, horizonte, 1.0 - exp(-dist * 0.028));
    }

    color = 1.0 - exp(-color * 1.05);                                  // tono (compresión de brillos)
    color = pow(color, vec3(1.0 / 2.2));                               // gamma
    float vig = 1.0 - 0.35 * dot(uv, uv);
    color *= vig;
    color += (hash(gl_FragCoord.xy) - 0.5) / 255.0;                    // ruido mínimo contra el "banding" del degradado
    outColor = vec4(color, 1.0);
  }`;

  const canvas = document.getElementById('c');
  const panelErrores = document.getElementById('errores');
  const gl = canvas.getContext('webgl2', { preserveDrawingBuffer: true });
  const fallo = (msg) => { console.error(msg); panelErrores.textContent += msg + '\n'; panelErrores.style.display = 'block'; };
  if (!gl) { fallo('Este navegador no tiene WebGL2.'); throw new Error('sin WebGL2'); }

  function compilar(tipo, fuente) {
    const s = gl.createShader(tipo);
    gl.shaderSource(s, fuente);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      throw new Error(`Error en el shader ${tipo === gl.VERTEX_SHADER ? 'vertex' : 'fragment'}:\n${gl.getShaderInfoLog(s)}`);
    }
    return s;
  }

  let programa;
  try {
    programa = gl.createProgram();
    gl.attachShader(programa, compilar(gl.VERTEX_SHADER, VERTEX));
    gl.attachShader(programa, compilar(gl.FRAGMENT_SHADER, FRAGMENT));
    gl.linkProgram(programa);
    if (!gl.getProgramParameter(programa, gl.LINK_STATUS)) throw new Error('Error al enlazar el programa:\n' + gl.getProgramInfoLog(programa));
  } catch (e) { fallo(e.message); throw e; }

  gl.useProgram(programa);
  gl.bindVertexArray(gl.createVertexArray());
  const uTime = gl.getUniformLocation(programa, 'u_time');
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.uniform2f(gl.getUniformLocation(programa, 'u_resolution'), canvas.width, canvas.height);

  window.seek = (t) => { gl.uniform1f(uTime, t); gl.drawArrays(gl.TRIANGLES, 0, 3); };
  window.seek(0);

  if (location.hash !== '#render') {
    const t0 = performance.now();
    (function bucle(ahora) { window.seek(((ahora - t0) / 1000) % window.DURATION); requestAnimationFrame(bucle); })(t0);
  }
</script>
</body>
</html>
